<style id="src-css">
/* Layout concept: asymmetric hero with the name on the left and a live "5-minute landing page" editor on the right,
   then a skills ribbon, projects, skills, an education timeline and a contact list. */
:root {
  --bg: #EDF1F7;
  --surface: #FFFFFF;
  --ink: #0D1730;
  --muted: #4F5C78;
  --line: #CFD8E8;
  --accent: #2F4BFF;
  --accent-ink: #FFFFFF;
  --hot: #D93A22;
  --code-bg: #0D1730;
  --code-fg: #DCE4FF;
  --code-dim: #6F7EA6;
  --tag: #8FB0FF;
  --str: #9BE3B5;
  --attr: #FFB48A;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1020; --surface: #111A31; --ink: #E8EDFB; --muted: #97A3C0; --line: #1F2C4D;
    --accent: #8097FF; --accent-ink: #0A1020; --hot: #FF7A5F;
    --code-bg: #070B16; --code-fg: #DCE4FF; --code-dim: #5D6C95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1020; --surface: #111A31; --ink: #E8EDFB; --muted: #97A3C0; --line: #1F2C4D;
  --accent: #8097FF; --accent-ink: #0A1020; --hot: #FF7A5F;
  --code-bg: #070B16; --code-fg: #DCE4FF; --code-dim: #5D6C95;
  color-scheme: dark;
}
html { scroll-behavior: auto; }
html body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
section[id] { scroll-margin-top: 72px; }

.navbar { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.gridbg {
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 30% 25%, #000 15%, transparent 72%);
  mask-image: radial-gradient(ellipse at 30% 25%, #000 15%, transparent 72%);
  opacity: .6;
}
.glow { background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 34%, transparent), transparent); filter: blur(12px); }
.ribbon { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); }
.card-hover { transition: border-color .25s ease, box-shadow .25s ease; }
.card-hover:hover { border-color: var(--accent); box-shadow: 0 18px 40px -22px color-mix(in srgb, var(--accent) 60%, transparent); }
.btn-primary { background: var(--accent); color: var(--accent-ink); transition: transform .2s ease, box-shadow .2s ease; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -14px var(--accent); }
.btn-ghost { border: 1px solid var(--ink); color: var(--ink); transition: background .2s ease, color .2s ease; }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }
.editor { background: var(--code-bg); color: var(--code-fg); box-shadow: 0 40px 70px -40px color-mix(in srgb, var(--accent) 70%, #000); }
.caret { display: inline-block; width: .6ch; height: 1.1em; vertical-align: -.18em; background: var(--accent); animation: blink 1s steps(1) infinite; }
.pop { animation: pop .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.tabnum { font-variant-numeric: tabular-nums; }
.timeline-dot { box-shadow: 0 0 0 4px var(--bg); }
@media (prefers-reduced-motion: reduce) {
  .pop, .caret { animation: none; }
  .btn-primary, .btn-ghost, .card-hover { transition: none; }
}
</style>

<script id="src-app">
(function () {
  const { useState, useEffect, useLayoutEffect, useRef } = React;
  const html = htm.bind(React.createElement);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  gsap.registerPlugin(ScrollTrigger);

  const WRAP = 'mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8';

  const ME = {
    email: 'yashnamdev02983@gmail.com',
    phone: '+91 97198 26280',
    phoneRaw: '+919719826280',
    github: 'https://github.com/yashverma369',
    linkedin: 'https://www.linkedin.com/in/yash369',
    demo: 'https://yashverma369.github.io/rich-ui-weather-app'
  };

  /* ---------- site data (projects added from the admin panel live in #site-data) ---------- */
  let DATA = { projects: [] };
  try {
    const raw = document.getElementById('site-data');
    if (raw) DATA = JSON.parse(raw.textContent) || DATA;
  } catch (e) { /* keep the empty default */ }
  if (!Array.isArray(DATA.projects)) DATA.projects = [];
  const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '');

  /* ---------- resume: embedded PDF (admin upload) or a PDF file next to index.html ---------- */
  const SAFE_FILE = /^[\w][\w .\-]*\.pdf$/i;
  const RESUME = DATA.resume && (DATA.resume.data || SAFE_FILE.test(DATA.resume.file || '')) ? DATA.resume : null;
  const fmtSize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  const fmtMonth = (iso) => {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  };
  function b64ToBlob(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'application/pdf' });
  }
  async function saveResume(r) {
    const blob = b64ToBlob(r.data);
    const name = r.name || 'Resume.pdf';
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); return 'saved'; }
      catch (e) { return e && e.code === 'declined' ? 'declined' : 'failed'; }
    }
    if (window.claude) return 'unavailable';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'saved';
  }

  /* ---------- republishing: rebuild this exact page with new data ---------- */
  const SO = '<scr' + 'ipt';
  const SC = '</scr' + 'ipt>';
  const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
  const FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">\n';
  const TAILWIND = 'https://cdn.tailwindcss.com/3.4.17';
  const LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
    'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js',
    'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js'
  ];
  const extScript = (u) => SO + ' src="' + u + '">' + SC + '\n';

  function buildDoc(data) {
    const css = document.getElementById('src-css').textContent;
    const tw = document.getElementById('src-tw').textContent;
    const app = document.getElementById('src-app').textContent;
    const json = JSON.stringify(data).replace(/</g, '\\u003c');
    return SKELETON +
      '<title>Yash Kumar</title>\n' + FONTS +
      '<style id="src-css">' + css + '</style>\n\n' +
      '<div id="root"></div>\n' +
      SO + ' id="site-data" type="application/json">' + json + SC + '\n' +
      extScript(TAILWIND) +
      SO + ' id="src-tw">' + tw + SC + '\n' +
      LIBS.map(extScript).join('') +
      SO + ' id="src-app">' + app + SC + '\n' +
      '\n</body></html>';
  }

  async function detectAdmin() {
    try {
      const c = window.claude;
      if (!c || !c.use) return null;
      const artifact = await c.use('artifact');
      if (!artifact) return null;
      const user = await c.use('user');
      const ok = user ? await user.canEdit() : false;
      return ok ? artifact : null;
    } catch (e) { return null; }
  }

  const RIBBON = ['HTML5', 'CSS3', 'JavaScript ES6', 'REST APIs', 'Responsive design', 'DOM manipulation',
    'Git and GitHub', 'GitHub Pages', 'Chrome DevTools', 'Python (learning)'];

  const CODE = [
    '<nav>Yash</nav>',
    '<header>',
    '  <h1>Hello, I build fast.</h1>',
    '  <p>Responsive UI in 5 minutes.</p>',
    '  <a class="btn">View work</a>',
    '</header>',
    '<section class="cards">',
    '  <div>HTML</div>',
    '  <div>CSS</div>',
    '</section>'
  ].join('\n');

  /* ---------- icons ---------- */
  const Icon = ({ children, size = 16 }) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${children}</svg>`;
  const ArrowUpRight = () => html`<${Icon}><path d="M7 17 17 7M8 7h9v9" /><//>`;
  const ArrowDown = () => html`<${Icon}><path d="M12 5v14M6 13l6 6 6-6" /><//>`;
  const CopyIcon = () => html`<${Icon}><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /><//>`;
  const CheckIcon = () => html`<${Icon}><path d="M5 12.5 10 17.5 19 7" /><//>`;
  const SunIcon = () => html`<${Icon} size=${18}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /><//>`;
  const DownloadIcon = () => html`<${Icon}><path d="M12 3v12M6.5 10.5 12 16l5.5-5.5M5 21h14" /><//>`;
  const MoonIcon = () => html`<${Icon} size=${18}><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" /><//>`;

  /* ---------- helpers ---------- */
  function useTheme() {
    const [t, setT] = useState(() => document.documentElement.dataset.theme ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    const toggle = () => {
      const n = t === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = n;
      setT(n);
    };
    return [t, toggle];
  }

  function hl(line) {
    const parts = line.split(/(<\/?[a-z0-9]+|\/?>|"[^"]*"|\b[a-z-]+(?==))/);
    return parts.map((t, i) => {
      if (!t) return null;
      let color = 'var(--code-fg)';
      if (i % 2 === 1) {
        if (t[0] === '<' || t === '>' || t === '/>') color = 'var(--tag)';
        else if (t[0] === '"') color = 'var(--str)';
        else color = 'var(--attr)';
      }
      return html`<span key=${i} style=${{ color }}>${t}</span>`;
    });
  }

  const SectionHead = ({ title, children }) => html`
    <div className="reveal mb-10 max-w-2xl">
      <h2 className="font-display text-4xl font-extrabold leading-[1.05] tracking-tight [text-wrap:balance] sm:text-5xl">${title}</h2>
      <p className="mt-3 text-lg text-muted">${children}</p>
    </div>`;

  /* ---------- nav ---------- */
  function Nav({ theme, toggle }) {
    const go = (id) => (e) => {
      e.preventDefault();
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
    };
    const links = [['projects', 'Projects'], ['skills', 'Skills'], ['education', 'Education'], ...(RESUME ? [['resume', 'Resume']] : []), ['contact', 'Contact']];
    return html`
      <header className="navbar sticky z-40" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
        <div className=${WRAP + ' relative flex h-16 items-center justify-between gap-4'}>
          <a href="#top" onClick=${go('top')} className="font-display text-xl font-extrabold tracking-tight">Yash Kumar</a>
          <nav className="flex items-center gap-1 sm:gap-2" aria-label="Sections">
            ${links.map(([id, label]) => html`
              <a key=${id} href=${'#' + id} onClick=${go(id)}
                 className=${'rounded-full px-3 py-1.5 text-sm font-medium text-muted hover:text-ink ' + (id === 'contact' ? 'btn-ghost !text-ink' : 'hidden md:inline-block')}>${label}</a>`)}
            <button type="button" onClick=${toggle} aria-label=${theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'}
                    className="ml-1 grid h-9 w-9 place-items-center rounded-full border border-line bg-surface text-ink hover:border-accent">
              ${theme === 'dark' ? html`<${SunIcon} />` : html`<${MoonIcon} />`}
            </button>
          </nav>
          <div id="progress" className="absolute bottom-[-1px] left-0 h-[2px] w-full bg-accent" style=${{ transform: 'scaleX(0)', transformOrigin: 'left' }}></div>
        </div>
      </header>`;
  }

  /* ---------- hero editor ---------- */
  function Editor() {
    const total = CODE.length;
    const [n, setN] = useState(reduce ? total : 0);
    const [run, setRun] = useState(0);
    const done = n >= total;

    useEffect(() => {
      if (reduce) return;
      setN(0);
      const o = { p: 0 };
      const tw = gsap.to(o, {
        p: 1, duration: 7, delay: run === 0 ? 1.5 : 0.2, ease: 'none',
        onUpdate() { setN(Math.round(o.p * total)); }
      });
      return () => tw.kill();
    }, [run]);

    const typed = CODE.slice(0, n);
    const lines = typed.split('\n');
    const has = (s) => typed.includes(s);
    const secs = Math.max(0, Math.ceil(300 * (1 - n / total)));
    const clock = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');

    return html`
      <div className="editor hf w-full overflow-hidden rounded-2xl" role="group" aria-label="Animated demo of a landing page being typed and rendered in five minutes">
        <div className="flex items-center justify-between gap-3 border-b px-4 py-3" style=${{ borderColor: 'color-mix(in srgb, var(--code-fg) 14%, transparent)' }}>
          <div className="flex min-w-0 items-center gap-2 font-mono text-xs text-codedim">
            <span className="h-2.5 w-2.5 rounded-full bg-codedim opacity-60"></span>
            <span className="truncate">landing.html</span>
          </div>
          <div className=${'tabnum flex items-center gap-2 rounded-full px-3 py-1 font-mono text-xs font-medium ' + (secs < 60 && !done ? 'text-hot' : 'text-codefg')}
               style=${{ background: 'color-mix(in srgb, var(--code-fg) 10%, transparent)' }}>
            <span className="text-codedim">round</span>
            <span>${clock}</span>
          </div>
        </div>

        <div className="min-h-[236px] overflow-x-auto px-4 py-4 font-mono text-[12.5px] leading-[22px]">
          ${lines.map((line, i) => html`
            <div key=${i} className="flex whitespace-pre">
              <span className="w-6 shrink-0 select-none pr-3 text-right text-codedim">${i + 1}</span>
              <span>${hl(line)}${i === lines.length - 1 ? html`<span className="caret"></span>` : null}</span>
            </div>`)}
        </div>

        <div className="px-4 pb-4">
          <div className="min-h-[236px] overflow-hidden rounded-xl border border-line bg-surface text-ink">
            <div className="flex items-center justify-between border-b border-line px-3 py-2 font-mono text-[11px] text-muted">
              <span>Live preview</span>
              <span>${done ? 'Submitted' : 'Building'}</span>
            </div>
            ${!has('</nav>') && html`<div className="grid h-[190px] place-items-center px-6 text-center text-sm text-muted">The page appears here as the code is typed.</div>`}
            ${has('</nav>') && html`
              <div className="pop border-b border-line px-4 py-2.5 font-display text-sm font-extrabold">Yash</div>`}
            ${has('</header>') || has('</h1>') ? html`
              <div className="px-5 pt-5">
                ${has('</h1>') && html`<div className="pop font-display text-2xl font-extrabold leading-tight tracking-tight">Hello, I build fast.</div>`}
                ${has('</p>') && html`<div className="pop mt-1 text-sm text-muted">Responsive UI in 5 minutes.</div>`}
                ${has('</a>') && html`<div className="pop mt-3 inline-block rounded-full bg-accent px-4 py-1.5 text-xs font-semibold text-accentink">View work</div>`}
              </div>` : null}
            ${has('</div>') && html`
              <div className="grid grid-cols-2 gap-3 px-5 pb-5 pt-4">
                <div className="pop rounded-lg border border-line px-3 py-3 text-center text-xs font-semibold">HTML</div>
                ${has('CSS</div>') && html`<div className="pop rounded-lg border border-line px-3 py-3 text-center text-xs font-semibold">CSS</div>`}
              </div>`}
          </div>
        </div>

        <div className="flex items-center justify-between gap-3 border-t px-4 py-3 text-xs" style=${{ borderColor: 'color-mix(in srgb, var(--code-fg) 14%, transparent)' }}>
          <div className="flex min-w-0 flex-1 items-center gap-3">
            <div className="h-1.5 w-full max-w-[160px] overflow-hidden rounded-full" style=${{ background: 'color-mix(in srgb, var(--code-fg) 14%, transparent)' }}>
              <div className="h-full rounded-full bg-accent" style=${{ width: (n / total * 100) + '%' }}></div>
            </div>
            <span className="truncate text-codedim">${done ? 'Done. 1st place.' : 'Typing the page from scratch'}</span>
          </div>
          <button type="button" onClick=${() => (reduce ? null : setRun(run + 1))}
                  className=${'rounded-full border px-3 py-1 font-medium text-codefg ' + (reduce ? 'hidden' : '')}
                  style=${{ borderColor: 'color-mix(in srgb, var(--code-fg) 28%, transparent)' }}>Replay</button>
        </div>
      </div>`;
  }

  /* ---------- hero ---------- */
  const Line = ({ text }) => html`
    <span className="block overflow-hidden pb-[0.04em] pt-[0.06em] leading-[0.95]" aria-hidden="true">
      ${[...text].map((c, i) => html`<span key=${i} className="hl inline-block">${c}</span>`)}
    </span>`;

  function Hero() {
    const root = useRef(null);
    useLayoutEffect(() => {
      const el = root.current;
      const glow = el.querySelector('.glow');
      let move;
      const ctx = gsap.context(() => {
        gsap.set(glow, { x: el.clientWidth * 0.5, y: 40 });
        if (reduce) return;
        const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
        tl.from('.hl', { yPercent: 115, duration: 0.9, stagger: 0.05 })
          .from('.hf', { y: 24, opacity: 0, duration: 0.7, stagger: 0.09 }, '-=0.6');
        const qx = gsap.quickTo(glow, 'x', { duration: 0.9, ease: 'power3' });
        const qy = gsap.quickTo(glow, 'y', { duration: 0.9, ease: 'power3' });
        move = (e) => {
          const r = el.getBoundingClientRect();
          qx(e.clientX - r.left - 250);

  function Admin({ artifact }) {
    const [open, setOpen] = useState(false);
    const [draft, setDraft] = useState(() => DATA.projects.map((p) => ({ ...p })));
    const [form, setForm] = useState(EMPTY);
    const [editing, setEditing] = useState(null);
    const [confirmId, setConfirmId] = useState(null);
    const [formErr, setFormErr] = useState('');
    const [state, setState] = useState('idle');
    const [pubErr, setPubErr] = useState('');
    const [rDraft, setRDraft] = useState(DATA.resume || null);
    const [rChanged, setRChanged] = useState(false);
    const [rErr, setRErr] = useState('');
    const fileRef = useRef(null);
    const dirty = rChanged || JSON.stringify(draft) !== JSON.stringify(DATA.projects);
    const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

    useEffect(() => {
      if (!open) return;
      const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [open]);

    const submit = (e) => {
      e.preventDefault();
      const title = form.title.trim();
      const desc = form.desc.trim();
      const demo = form.demo.trim();
      const repo = form.repo.trim();
      if (!title) return setFormErr('Add a project title.');
      if (!desc) return setFormErr('Add a short description.');
      if (demo && !safeUrl(demo)) return setFormErr('The live link must start with https:// or http://.');
      if (repo && !safeUrl(repo)) return setFormErr('The source link must start with https:// or http://.');
      const project = {
        id: editing || 'p' + Date.now().toString(36),
        title, desc, demo, repo,
        tag: form.tag.trim(),
        status: form.status,
        tech: form.tech.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 8)
      };
      setDraft(editing ? draft.map((p) => (p.id === editing ? project : p)) : [...draft, project]);
      setForm(EMPTY);
      setEditing(null);
      setFormErr('');
    };

    const startEdit = (p) => {
      setForm({ title: p.title, tag: p.tag || '', status: p.status || 'Live', desc: p.desc, tech: (p.tech || []).join(', '), demo: p.demo || '', repo: p.repo || '' });
      setEditing(p.id);
      setFormErr('');
    };
    const cancelEdit = () => { setForm(EMPTY); setEditing(null); setFormErr(''); };
    const remove = (id) => {
      setDraft(draft.filter((p) => p.id !== id));
      setConfirmId(null);
      if (editing === id) cancelEdit();
    };
    const move = (i, d) => {
      const j = i + d;
      if (j < 0 || j >= draft.length) return;
      const next = draft.slice();
      [next[i], next[j]] = [next[j], next[i]];
      setDraft(next);
    };

    const onResume = async (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      if (f.size > 3 * 1024 * 1024) return setRErr('This file is larger than 3 MB. Export a smaller PDF and try again.');
      try {
        const buf = await f.arrayBuffer();
        const bytes = new Uint8Array(buf);
        if (String.fromCharCode(...bytes.subarray(0, 5)) !== '%PDF-') return setRErr('Choose a PDF file.');
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        setRDraft({ name: 'Yash_Kumar_Resume.pdf', data: btoa(bin), size: f.size, updated: new Date().toISOString().slice(0, 10) });
        setRChanged(true);
        setRErr('');
      } catch (err) {
        setRErr('This file could not be read. Try another copy of the PDF.');
      }
    };
    const removeResume = () => { setRDraft(null); setRChanged(true); setRErr(''); };

    const publish = async () => {
      setState('publishing');
      setPubErr('');
      try {
        await artifact.publish(buildDoc({ projects: draft, resume: rDraft }));
        setState('done');
      } catch (e) {
        setState('idle');
        const code = e && e.code;
        if (code === 'not_writer' || code === 'not_granted') setPubErr('This account can view the page but cannot publish it.');
        else if (code === 'conflict') setPubErr('The page was updated somewhere else. It is reloading with the latest version, so add your change again.');
        else if (code === 'rate_limited') setPubErr('Too many publishes in a row. Wait a minute and try again.');
        else setPubErr('Publishing failed. Check your connection and try again.');
      }
    };

    const small = 'rounded-full border border-line px-3 py-1 text-sm font-medium hover:border-accent';

    return html`
      <div>
        <button type="button" onClick=${() => setOpen(true)}
                className="btn-primary fixed right-4 z-40 inline-flex items-center gap-2 rounded-full px-5 py-3 text-sm font-semibold shadow-lg"
                style=${{ bottom: 'calc(env(safe-area-inset-bottom, 0px) + 1rem)' }}>
          Admin${dirty ? ' (unpublished changes)' : ''}
        </button>

        ${open ? html`
          <div className="fixed inset-0 z-50 flex justify-end" role="dialog" aria-modal="true" aria-label="Manage projects">
            <div className="absolute inset-0" style=${{ background: 'color-mix(in srgb, var(--ink) 50%, transparent)' }} onClick=${() => setOpen(false)}></div>
            <div className="relative flex h-full w-full max-w-md flex-col border-l border-line bg-surface text-ink">
              <div className="flex items-start justify-between gap-4 border-b border-line px-5 pb-4 sm:px-6" style=${{ paddingTop: 'calc(env(safe-area-inset-top, 0px) + 1.25rem)' }}>
                <div>
                  <h2 className="font-display text-2xl font-extrabold tracking-tight">Manage projects</h2>
                  <p className="mt-1 text-sm text-muted">Only you see this panel. Publishing updates the page for every visitor.</p>
                </div>
                <button type="button" onClick=${() => setOpen(false)} className=${small}>Close</button>
              </div>

              <div className="flex-1 overflow-y-auto px-5 py-5 sm:px-6">
                <form onSubmit=${submit} className="grid gap-4" noValidate>
                  <h3 className="font-display text-lg font-extrabold">${editing ? 'Edit project' : 'Add a project'}</h3>
                  <${Field} id="adm-title" label="Title">
                    <input id="adm-title" className=${FIELD} value=${form.title} onChange=${set('title')} placeholder="Portfolio Website" maxLength="80" />
                  <//>
                  <div className="grid gap-4 sm:grid-cols-2">
                    <${Field} id="adm-tag" label="Type">
                      <input id="adm-tag" className=${FIELD} value=${form.tag} onChange=${set('tag')} placeholder="Personal project" maxLength="40" />
                    <//>
                    <${Field} id="adm-status" label="Status">
                      <select id="adm-status" className=${FIELD} value=${form.status} onChange=${set('status')}>
                        <option value="Live">Live</option>
                        <option value="In progress">In progress</option>
                        <option value="Completed">Completed</option>
                      </select>
                    <//>
                  </div>
                  <${Field} id="adm-desc" label="Description" hint="Two or three lines on what it does and what you used.">
                    <textarea id="adm-desc" rows="4" className=${FIELD} value=${form.desc} onChange=${set('desc')} maxLength="600"></textarea>
                  <//>
                  <${Field} id="adm-tech" label="Tech stack" hint="Separate with commas, up to 8.">
                    <input id="adm-tech" className=${FIELD} value=${form.tech} onChange=${set('tech')} placeholder="React, Tailwind CSS, GSAP" />
                  <//>
                  <${Field} id="adm-demo" label="Live link">
                    <input id="adm-demo" className=${FIELD} value=${form.demo} onChange=${set('demo')} placeholder="https://" inputMode="url" />
                  <//>
                  <${Field} id="adm-repo" label="Source code link">
                    <input id="adm-repo" className=${FIELD} value=${form.repo} onChange=${set('repo')} placeholder="https://github.com/yashverma369/..." inputMode="url" />
                  <//>
                  ${formErr ? html`<p className="text-sm font-medium text-hot" role="alert">${formErr}</p>` : null}
                  <div className="flex flex-wrap gap-2">
                    <button type="submit" className="btn-primary rounded-full px-5 py-2.5 text-sm font-semibold">${editing ? 'Update project' : 'Add to list'}</button>
                    ${editing ? html`<button type="button" onClick=${cancelEdit} className=${small + ' py-2.5'}>Cancel</button>` : null}
                  </div>
                </form>

                <div className="mt-8 border-t border-line pt-6">
                  <h3 className="font-display text-lg font-extrabold">Added projects</h3>
                  <p className="mt-1 text-sm text-muted">The weather app and the hackathon win are built in and stay on the page.</p>
                  ${draft.length === 0 ? html`<p className="mt-4 rounded-lg border border-dashed border-line p-4 text-sm text-muted">Nothing added yet. Fill in the form above and choose Add to list.</p>` : html`
                    <ul className="mt-4 grid gap-3">
                      ${draft.map((p, i) => html`
                        <li key=${p.id} className="rounded-xl border border-line bg-paper p-4">
                          <div className="font-display font-extrabold [overflow-wrap:anywhere]">${p.title}</div>
                          <div className="text-sm text-muted">${[p.tag, p.status].filter(Boolean).join(', ')}</div>
                          <div className="mt-3 flex flex-wrap gap-2">
                            <button type="button" className=${small} onClick=${() => startEdit(p)}>Edit</button>
                            <button type="button" className=${small} onClick=${() => move(i, -1)} disabled=${i === 0} aria-label=${'Move ' + p.title + ' earlier'}>Move up</button>
                            <button type="button" className=${small} onClick=${() => move(i, 1)} disabled=${i === draft.length - 1} aria-label=${'Move ' + p.title + ' later'}>Move down</button>
                            ${confirmId === p.id ? html`
                              <button type="button" className=${small + ' !border-hot text-hot'} onClick=${() => remove(p.id)}>Confirm delete</button>
                              <button type="button" className=${small} onClick=${() => setConfirmId(null)}>Keep</button>` : html`
                              <button type="button" className=${small} onClick=${() => setConfirmId(p.id)}>Delete</button>`}
                          </div>
                        </li>`)}
                    </ul>`}
                </div>

                <div className="mt-8 border-t border-line pt-6">
                  <h3 className="font-display text-lg font-extrabold">Resume</h3>
                  <p className="mt-1 text-sm text-muted">The PDF is stored inside the page. Visitors download it from the Resume section.</p>
                  <div className="mt-4 rounded-xl border border-line bg-paper p-4">
                    ${rDraft && (rDraft.data || rDraft.file) ? html`
                      <div className="font-display font-extrabold [overflow-wrap:anywhere]">${rDraft.name || rDraft.file}</div>
                      <div className="tabnum text-sm text-muted">${[rDraft.size ? fmtSize(rDraft.size) : '', rDraft.updated ? 'updated ' + rDraft.updated : ''].filter(Boolean).join(', ')}${rChanged ? ' (new, not published yet)' : ''}</div>` : html`
                      <div className="text-sm text-muted">${rChanged ? 'The resume will be removed when you publish.' : 'No resume on the page yet.'}</div>`}
                    <input ref=${fileRef} id="adm-resume" type="file" accept="application/pdf,.pdf" hidden onChange=${onResume} />
                    <div className="mt-3 flex flex-wrap gap-2">
                      <button type="button" className=${small} onClick=${() => fileRef.current && fileRef.current.click()}>${rDraft ? 'Replace PDF' : 'Upload PDF'}</button>
                      ${rDraft ? html`<button type="button" className=${small} onClick=${removeResume}>Remove</button>` : null}
                    </div>
                  </div>
                  ${rErr ? html`<p className="mt-3 text-sm font-medium text-hot" role="alert">${rErr}</p>` : null}
                </div>
              </div>

              <div className="border-t border-line px-5 pt-4 sm:px-6" style=${{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 1rem)' }}>
                ${pubErr ? html`<p className="mb-3 text-sm font-medium text-hot" role="alert">${pubErr}</p>` : null}
                <div className="flex flex-wrap items-center gap-3">
                  <button type="button" onClick=${publish} disabled=${!dirty || state !== 'idle'}
                          className="btn-primary rounded-full px-5 py-2.5 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-50">
                    ${state === 'publishing' ? 'Publishing...' : state === 'done' ? 'Published' : 'Publish changes'}
                  </button>
                  <span className="text-sm text-muted">${state === 'done' ? 'The page is reloading with your changes.' : dirty ? 'You have unpublished changes.' : 'Everything is published.'}</span>
                </div>
              </div>
            </div>
          </div>` : null}
      </div>`;
  }

  /* ---------- app ---------- */
  function App() {
    const [theme, toggle] = useTheme();
    const [artifact, setArtifact] = useState(null);
    useEffect(() => {
      let alive = true;
      detectAdmin().then((a) => { if (alive) setArtifact(a); });
      return () => { alive = false; };
    }, []);
    useLayoutEffect(() => {
      const ctx = gsap.context(() => {
        if (reduce) return;
        gsap.utils.toArray('.reveal').forEach((el) => {
          gsap.from(el, { y: 40, opacity: 0.25, duration: 0.8, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 92%', once: true } });
        });
        gsap.to('#progress', { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: 0.3 } });
      });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
      return () => ctx.revert();
    }, []);
    return html`
      <div>
        <${Nav} theme=${theme} toggle=${toggle} />
        <main>
          <${Hero} />
          <${Ribbon} />
          <${Projects} />
          <${Skills} />
          <${Education} />
          <${ResumeSection} />
        </main>
        <${Contact} />
        ${artifact ? html`<${Admin} artifact=${artifact} />` : null}
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body>
</html>
